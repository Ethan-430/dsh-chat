<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>DSH Chat</title>
    <script>
      /* 首屏前定主题：深色用户不该先看到一帧白屏。
         逻辑必须与 src/theme.ts 保持一致（键名 dsh_theme，值 auto|light|dark）。 */
      (function () {
        try {
          var saved = localStorage.getItem('dsh_theme') || 'auto';
          var dark = saved === 'dark' || (saved === 'auto' &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#181b22' : '#f5f5f7');
        } catch (e) { /* localStorage 不可用时按浅色渲染 */ }
      })();
    </script>
    <style>
      /* 主题就绪前不要闪：body 默认底色跟随变量 */
      html { background: #f5f5f7; }
      html[data-theme="dark"] { background: #0f1116; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
