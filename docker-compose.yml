services:
  backend:
    # 构建上下文必须是项目根：Dockerfile 需要同时 COPY frontend/ 与 backend/
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SQLITE_PATH: /data/dsh_chat.db
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - chat_data:/data
  redis:
    image: redis:7-alpine
    # 仅容器内网可达，不映射公网端口；设密码（第十三节 13.3）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    volumes:
      - redis_data:/data
volumes:
  chat_data:
  redis_data:
